name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sdk:
    name: SDK & Spec Drift Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version 25.1.0

      - name: Build YieldVault WASM
        run: cargo build --target wasm32-unknown-unknown --release --package yield_vault
        working-directory: contracts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm ci

      - name: Verify Contract & API Spec Drift
        working-directory: packages/sdk
        run: npm run verify-drift

      - name: Run SDK Tests
        working-directory: packages/sdk
        run: npm test

      - name: Build SDK Package
        working-directory: packages/sdk
        run: npm run build

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/stellaryield_test"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stellaryield_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Harden npm network settings
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 120000

      - name: Install backend dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Lint backend
        continue-on-error: true
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Check for unapplied schema changes
        run: npx prisma migrate status || (echo "Unapplied schema changes detected" && exit 1)

      - name: Run backend tests
        id: backend_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Upload backend failure log
        id: upload_backend_log
        if: steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-logs-${{ github.run_id }}
          path: server/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize backend failure
        if: steps.backend_tests.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          scripts/ci-summarize-failure.sh "Backend Checks" \
            "backend-failure-logs-${{ github.run_id }}" \
            "${{ steps.upload_backend_log.outputs.artifact-url }}" \
            server/backend-test.log

      - name: Fail backend job if tests failed
        if: steps.backend_tests.outcome == 'failure'
        run: exit 1

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Harden npm network settings
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 120000

      - name: Install client dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Lint frontend (CI scoped)
        continue-on-error: true
        run: npm run lint:ci-scope

      - name: Run frontend tests
        id: frontend_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Build frontend and capture logs
        id: frontend_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Upload frontend failure artifacts
        id: upload_frontend_artifacts
        if: steps.frontend_tests.outcome == 'failure' || steps.frontend_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-artifacts-${{ github.run_id }}
          path: |
            client/frontend-test.log
            client/frontend-build.log
            client/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize frontend failure
        if: steps.frontend_tests.outcome == 'failure' || steps.frontend_build.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          scripts/ci-summarize-failure.sh "Frontend Checks" \
            "frontend-failure-artifacts-${{ github.run_id }}" \
            "${{ steps.upload_frontend_artifacts.outputs.artifact-url }}" \
            client/frontend-test.log client/frontend-build.log

      - name: Fail frontend job if tests failed
        if: steps.frontend_tests.outcome == 'failure'
        run: exit 1

  contracts:
    name: Soroban Contract Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Run contract tests
        id: contract_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee contract-test.log

      - name: Run contract fuzz tests (quick profile) (#903)
        id: contract_fuzz
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --test fuzz --lib 2>&1 | tee contract-fuzz.log

      - name: Upload contract test logs
        id: upload_contract_test_logs
        if: steps.contract_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-logs-${{ github.run_id }}
          path: contracts/contract-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload contract fuzz logs
        id: upload_contract_fuzz_logs
        if: steps.contract_fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: contract-fuzz-logs-${{ github.run_id }}
          path: contracts/contract-fuzz.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize contracts failure
        if: steps.contract_tests.outcome == 'failure' || steps.contract_fuzz.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [ "${{ steps.contract_tests.outcome }}" = "failure" ]; then
            scripts/ci-summarize-failure.sh "Soroban Contract Checks — tests" \
              "contract-test-logs-${{ github.run_id }}" \
              "${{ steps.upload_contract_test_logs.outputs.artifact-url }}" \
              contracts/contract-test.log
          fi
          if [ "${{ steps.contract_fuzz.outcome }}" = "failure" ]; then
            scripts/ci-summarize-failure.sh "Soroban Contract Checks — fuzz" \
              "contract-fuzz-logs-${{ github.run_id }}" \
              "${{ steps.upload_contract_fuzz_logs.outputs.artifact-url }}" \
              contracts/contract-fuzz.log
          fi

      - name: Fail contracts job if tests failed
        if: steps.contract_tests.outcome == 'failure'
        run: exit 1

      - name: Set up Node.js for contract script tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install contract script dependencies
        working-directory: contracts
        run: npm ci

      - name: Run contract script tests
        working-directory: contracts
        run: npm test

      - name: Verify deployment manifest
        working-directory: .
        shell: bash
        run: |
          if [ -f contracts/scripts/deployment-manifest.json ]; then
            node contracts/scripts/verify-manifest.js \
              --manifest contracts/scripts/deployment-manifest.json \
              --registry contracts/registry.json \
              --network testnet
          else
            echo "No deployment manifest found — skipping verification"
          fi

  keeper:
    name: Keeper Bot Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend/keepers
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/keepers/package-lock.json

      - name: Install keeper dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Run keeper tests
        id: keeper_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee keeper-test.log

      - name: Upload keeper failure log
        id: upload_keeper_log
        if: steps.keeper_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: keeper-failure-logs-${{ github.run_id }}
          path: backend/keepers/keeper-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize keeper failure
        if: steps.keeper_tests.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          scripts/ci-summarize-failure.sh "Keeper Bot Checks" \
            "keeper-failure-logs-${{ github.run_id }}" \
            "${{ steps.upload_keeper_log.outputs.artifact-url }}" \
            backend/keepers/keeper-test.log

      - name: Fail keeper job if tests failed
        if: steps.keeper_tests.outcome == 'failure'
        run: exit 1

  rewards:
    name: Rewards Service Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend/rewards
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/rewards/package-lock.json

      - name: Install rewards dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Run rewards tests
        id: rewards_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee rewards-test.log

      - name: Upload rewards failure log
        id: upload_rewards_log
        if: steps.rewards_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rewards-failure-logs-${{ github.run_id }}
          path: backend/rewards/rewards-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize rewards failure
        if: steps.rewards_tests.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          scripts/ci-summarize-failure.sh "Rewards Service Checks" \
            "rewards-failure-logs-${{ github.run_id }}" \
            "${{ steps.upload_rewards_log.outputs.artifact-url }}" \
            backend/rewards/rewards-test.log

      - name: Fail rewards job if tests failed
        if: steps.rewards_tests.outcome == 'failure'
        run: exit 1

  readme-commands:
    name: README Command Verification
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify documented README commands
        run: node scripts/verify-readme-commands.js

  verification:
    name: Formal Verification (Kani)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Run Kani verification
        run: cd contracts/yield_vault && cargo kani --harness verification::prove_fee_bounds --harness verification::prove_flash_loan_security --harness verification::prove_deposit_share_calculation
